name: "node-maintenance"
exam: cka
weight: 6
difficulty: easy
duration: 8
domains:
  - "Scheduling"
description: |
  Prepare one worker node for maintenance.
  Cordon it and drain it while ignoring DaemonSets and deleting emptyDir data.
context: |
  Cluster: kind-cka-exam
  Node: any worker node
setup: |
  kubectl create deployment maintenance-nginx --image=nginx --replicas=2 --dry-run=client -o yaml | kubectl apply -f -
  kubectl rollout status deployment/maintenance-nginx --timeout=120s
hints:
  - "List nodes first to identify a worker."
  - "Use `kubectl cordon` followed by `kubectl drain`."
  - "The drain command should include `--ignore-daemonsets` and `--delete-emptydir-data`."
validation: |
  set -euo pipefail
  WORKER=$(kubectl get nodes -o json | jq -r '.items[] | select(.metadata.labels["node-role.kubernetes.io/control-plane"] == null) | .metadata.name' | head -n1)
  echo "Checking worker node scheduling state..."
  kubectl get node "$WORKER" -o json | jq -e '.spec.unschedulable == true' >/dev/null
  echo "PASS: worker node is cordoned"
solution: |
  WORKER=$(kubectl get nodes -o json | jq -r '.items[] | select(.metadata.labels["node-role.kubernetes.io/control-plane"] == null) | .metadata.name' | head -n1)
  kubectl cordon "$WORKER"
  kubectl drain "$WORKER" --ignore-daemonsets --delete-emptydir-data --force
