name: "service-networking"
exam: cka
weight: 6
difficulty: medium
duration: 8
domains:
  - "Services & Networking"
description: |
  Expose the `backend-api` deployment in namespace `networking` using a ClusterIP service named `backend` on port 80,
  then create a temporary pod and verify DNS-based connectivity to the service.
context: |
  Cluster: kind-cka-exam
  Namespace: networking
setup: |
  kubectl create namespace networking --dry-run=client -o yaml | kubectl apply -f -
  kubectl create deployment backend-api -n networking --image=nginx --replicas=1 --dry-run=client -o yaml | kubectl apply -f -
  kubectl rollout status deployment/backend-api -n networking --timeout=120s
  kubectl delete service backend -n networking --ignore-not-found
hints:
  - "Use a selector that matches the deployment's pod labels."
  - "A temporary busybox pod can test DNS resolution and HTTP connectivity."
  - "`kubectl run ... --rm -it` is handy interactively, but any successful verification works."
validation: |
  set -euo pipefail
  echo "Checking service exists..."
  kubectl get service backend -n networking -o json | jq -e '.spec.ports[] | select(.port == 80)' >/dev/null
  echo "PASS: service exposes port 80"
  echo "Checking endpoints are ready..."
  kubectl get endpoints backend -n networking -o json | jq -e '.subsets[0].addresses | length > 0' >/dev/null
  echo "PASS: service has endpoints"
solution: |
  kubectl expose deployment backend-api -n networking --name=backend --port=80 --target-port=80 --type=ClusterIP
  kubectl run dns-test -n networking --image=busybox:1.36 --restart=Never --rm -i -- wget -qO- http://backend
