name: "configmap-secret"
exam: ckad
weight: 7
difficulty: medium
duration: 10
domains:
  - "Application Environment, Configuration and Security"
description: |
  Create a ConfigMap `app-config` with key `APP_MODE=production` and a Secret `app-secret` with key `API_TOKEN=secure-token`.
  Mount both into a pod named `config-consumer` in namespace `apps` under `/etc/config` and `/etc/secret`.
context: |
  Cluster: kind-ckad-exam
  Namespace: apps
setup: |
  kubectl create namespace apps --dry-run=client -o yaml | kubectl apply -f -
  kubectl delete pod config-consumer -n apps --ignore-not-found
  kubectl delete configmap app-config -n apps --ignore-not-found
  kubectl delete secret app-secret -n apps --ignore-not-found
hints:
  - "Use `kubectl create configmap` and `kubectl create secret generic` with `--dry-run=client -o yaml`."
  - "Secrets and ConfigMaps can both be mounted as volumes."
  - "Use two volume mounts in the pod spec."
validation: |
  set -euo pipefail
  echo "Checking ConfigMap and Secret..."
  kubectl get configmap app-config -n apps -o json | jq -e '.data.APP_MODE == "production"' >/dev/null
  kubectl get secret app-secret -n apps -o json | jq -e '.data.API_TOKEN != null' >/dev/null
  echo "PASS: config resources exist"
  echo "Checking pod volume mounts..."
  kubectl get pod config-consumer -n apps -o json | jq -e '.spec.volumes[] | select((.configMap and .configMap.name == "app-config") or (.secret and .secret.secretName == "app-secret"))' >/dev/null
  echo "PASS: pod mounts config and secret volumes"
solution: |
  kubectl create configmap app-config -n apps --from-literal=APP_MODE=production --dry-run=client -o yaml | kubectl apply -f -
  kubectl create secret generic app-secret -n apps --from-literal=API_TOKEN=secure-token --dry-run=client -o yaml | kubectl apply -f -
  cat <<EOF_YAML | kubectl apply -f -
  apiVersion: v1
  kind: Pod
  metadata:
    name: config-consumer
    namespace: apps
  spec:
    containers:
      - name: app
        image: nginx
        volumeMounts:
          - name: app-config
            mountPath: /etc/config
          - name: app-secret
            mountPath: /etc/secret
    volumes:
      - name: app-config
        configMap:
          name: app-config
      - name: app-secret
        secret:
          secretName: app-secret
  EOF_YAML
