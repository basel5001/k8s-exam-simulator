name: "probes"
exam: ckad
weight: 6
difficulty: medium
duration: 8
domains:
  - "Application Observability and Maintenance"
description: |
  Create a pod named `health-app` in namespace `apps` using nginx.
  Configure a startup probe, liveness probe, and readiness probe that all perform HTTP checks on `/` port 80.
context: |
  Cluster: kind-ckad-exam
  Namespace: apps
setup: |
  kubectl create namespace apps --dry-run=client -o yaml | kubectl apply -f -
  kubectl delete pod health-app -n apps --ignore-not-found
hints:
  - "All three probes can use `httpGet` against path `/`."
  - "Use different failure thresholds or delays to distinguish startup from liveness/readiness."
  - "Verify with `kubectl describe pod health-app`."
validation: |
  set -euo pipefail
  echo "Checking probes on pod..."
  kubectl get pod health-app -n apps -o json | jq -e '.spec.containers[0].livenessProbe.httpGet.path == "/" and .spec.containers[0].readinessProbe.httpGet.path == "/" and .spec.containers[0].startupProbe.httpGet.path == "/"' >/dev/null
  echo "PASS: all required probes configured"
solution: |
  cat <<EOF_YAML | kubectl apply -f -
  apiVersion: v1
  kind: Pod
  metadata:
    name: health-app
    namespace: apps
  spec:
    containers:
      - name: app
        image: nginx
        startupProbe:
          httpGet:
            path: /
            port: 80
          failureThreshold: 30
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
  EOF_YAML
